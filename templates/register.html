{% extends "base.html" %}
{% block title %}Register | CivicAI{% endblock %}
{% block content %}
<div class="auth-card mx-auto">
  <h2 class="fw-bold">Create account</h2><p class="text-muted">Register as a citizen to submit complaints.</p>
  <form method="post">
    <label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
    <label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
    <label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="6" required>
    <button class="btn btn-primary w-100">Create Account</button>
  </form>
</div>
{% endblock %}
